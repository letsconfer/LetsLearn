<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLA1 - French Alphabet in Hindi with Audio</title>
    <script src="master-config.js"></script>
    <script src="restrictions.js"></script>
    <style>
        :root {
            --primary-color: #0055A5;
            --secondary-color: #EF4135;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        /* Top Navbar for Theme & Download Controls */
        .top-nav {
            max-width: 1000px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .nav-btn:hover {
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #fff;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .french-letter {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .hindi-sound {
            font-size: 1.1rem;
            font-weight: 500;
            color: #d97706;
        }

        .inline-audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }

        .inline-audio-btn:hover {
            background-color: #e2e8f0;
            transform: scale(1.1);
        }

        .inline-audio-btn:active {
            transform: scale(1);
        }

        @media (max-width: 600px) {
            th, td {
                padding: 8px 10px;
                font-size: 0.9rem;
            }
            .french-letter {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<!-- Navigation Bar for Master-Config & Restrictions Integration -->
<div class="top-nav">
    <button class="nav-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Change Theme">🎨 Theme</button>
    <button class="nav-btn" id="downloadBtn" onclick="downloadPage()" title="Download Page">📥 Download</button>
</div>

<div class="container">
    <h1>French Alphabets</h1>
    <p class="subtitle">French letters with phonetic & Hindi pronunciation (FLA1)</p>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Letter</th>
                    <th>Phonetic Sound</th>
                    <th>Hindi Sound</th>
                    <th>Example (French)</th>
                    <th>English Translation</th>
                </tr>
            </thead>
            <tbody id="alphabetTable">
                <!-- JavaScript will generate table rows here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const alphabetData = [
        { letter: 'A', sound: 'AHH', hindi: 'आ', example: 'Avion (आवियों)', english: 'Aeroplane' },
        { letter: 'B', sound: 'BAY', hindi: 'बे', example: 'Banane (बनान)', english: 'Banana' },
        { letter: 'C', sound: 'CAY', hindi: 'से', example: 'Chat', english: 'Cat' },
        { letter: 'D', sound: 'DAY', hindi: 'दे', example: 'Dauphin', english: 'Dolphin' },
        { letter: 'E', sound: 'A', hindi: 'अ', example: 'Éléphant', english: 'Elephant' },
        { letter: 'F', sound: 'F', hindi: 'एफ', example: 'Fleur', english: 'Flower' },
        { letter: 'G', sound: 'JE', hindi: 'जे', example: 'Gâteau', english: 'Cake' },
        { letter: 'H', sound: 'ASH', hindi: 'आेश / आश', example: 'Homme', english: 'Man' },
        { letter: 'I', sound: 'EE', hindi: 'ई', example: 'Image', english: 'Picture' },
        { letter: 'J', sound: 'JHEE', hindi: 'जी', example: 'Jardin', english: 'Garden' },
        { letter: 'K', sound: 'KAH', hindi: 'का', example: 'Koala', english: 'Koala' },
        { letter: 'L', sound: 'L', hindi: 'एल', example: 'Livre', english: 'Book' },
        { letter: 'M', sound: 'M', hindi: 'एम', example: 'Maison', english: 'House' },
        { letter: 'N', sound: 'N', hindi: 'एन', example: 'Nuit', english: 'Night' },
        { letter: 'O', sound: 'O', hindi: 'ओ', example: 'Oiseau', english: 'Bird' },
        { letter: 'P', sound: 'PAY', hindi: 'पे', example: 'Pomme', english: 'Apple' },
        { letter: 'Q', sound: 'KEU', hindi: 'क्यु', example: 'Quatre', english: 'Four' },
        { letter: 'R', sound: 'ERR', hindi: 'एर', example: 'Rouge', english: 'Red' },
        { letter: 'S', sound: 'ESS', hindi: 'एस', example: 'Soleil', english: 'Sun' },
        { letter: 'T', sound: 'TAY', hindi: 'ते', example: 'Table', english: 'Table' },
        { letter: 'U', sound: 'EU', hindi: 'यु', example: 'Un', english: 'One' },
        { letter: 'V', sound: 'VAY', hindi: 'वे', example: 'Voiture', english: 'Car' },
        { letter: 'W', sound: 'Double WAY', hindi: 'दुबल वे', example: 'Wagon', english: 'Carriage' },
        { letter: 'X', sound: 'EXX', hindi: 'इक्स', example: 'Xylophone', english: 'Xylophone' },
        { letter: 'Y', sound: 'EGRICK', hindi: 'इग्रेक', example: 'Yeux', english: 'Eyes' },
        { letter: 'Z', sound: 'ZED', hindi: 'ज़ेद', example: 'Zèbre', english: 'Zebra' }
    ];

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('Speech synthesis is not supported in your browser.');
        }
    }

    // Placeholders for configuration functions if not defined in master-config.js
    function toggleTheme() {
        if (typeof window.switchTheme === 'function') {
            window.switchTheme();
        } else {
            document.body.style.filter = document.body.style.filter ? '' : 'invert(1)';
        }
    }

    function downloadPage() {
        if (typeof window.triggerDownload === 'function') {
            window.triggerDownload();
        } else {
            window.print();
        }
    }

    const tbody = document.getElementById('alphabetTable');

    alphabetData.forEach(item => {
        const row = document.createElement('tr');
        const cleanExampleWord = item.example.split(' ')[0];
        
        row.innerHTML = `
            <td class="french-letter">${item.letter}</td>
            <td>
                ${item.sound}
                <button class="inline-audio-btn" onclick="playAudio('${item.letter}')" title="Listen to letter">🔊</button>
            </td>
            <td class="hindi-sound">${item.hindi}</td>
            <td>
                ${item.example}
                <button class="inline-audio-btn" onclick="playAudio('${cleanExampleWord}')" title="Listen to example">🔊</button>
            </td>
            <td>${item.english}</td>
        `;
        
        tbody.appendChild(row);
    });
</script>

</body>
</html>
