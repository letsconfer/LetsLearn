<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLA1 - French Alphabet in Hindi with Audio</title>
    <script src="master-config.js"></script>
    <script src="restrictions.js"></script>
    <style>
        :root {
            --primary-color: #0055A5;
            --secondary-color: #EF4135;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
        }

        /* Container where restrictions.js automatically injects Home, Theme, and Download icons */
        .theme-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: var(--card-bg);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        .french-letter {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .hindi-sound {
            font-size: 1.1rem;
            font-weight: 500;
            color: #d97706;
        }

        /* Inline Audio Pronunciation Button using listen.png */
        .inline-audio-btn {
            background: transparent url('listen.png') no-repeat center;
            background-size: 20px 20px;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 24px;
            margin-left: 8px;
            padding: 0;
            vertical-align: middle;
            transition: transform 0.1s;
            display: inline-block;
        }

        .inline-audio-btn:hover {
            transform: scale(1.15);
        }

        @media (max-width: 600px) {
            th, td {
                padding: 8px 10px;
                font-size: 0.9rem;
            }
            .french-letter {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- restrictions.js automatically hooks into this class to place the icons -->
    <div class="theme-switcher"></div>

    <h1>French Alphabets</h1>
    <p class="subtitle">French letters with phonetic & Hindi pronunciation (FLA1)</p>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Letter</th>
                    <th>Phonetic Sound</th>
                    <th>Hindi Sound</th>
                    <th>Example (French)</th>
                    <th>English Translation</th>
                </tr>
            </thead>
            <tbody id="alphabetTable">
                <!-- JavaScript will generate table rows here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const alphabetData = [
        { letter: 'A', sound: 'AHH', hindi: 'आ', example: 'Avion (आवियों)', english: 'Aeroplane' },
        { letter: 'B', sound: 'BAY', hindi: 'बे', example: 'Banane (बनान)', english: 'Banana' },
        { letter: 'C', sound: 'CAY', hindi: 'से', example: 'Chat', english: 'Cat' },
        { letter: 'D', sound: 'DAY', hindi: 'दे', example: 'Dauphin', english: 'Dolphin' },
        { letter: 'E', sound: 'A', hindi: 'अ', example: 'Éléphant', english: 'Elephant' },
        { letter: 'F', sound: 'F', hindi: 'एफ', example: 'Fleur', english: 'Flower' },
        { letter: 'G', sound: 'JE', hindi: 'जे', example: 'Gâteau', english: 'Cake' },
        { letter: 'H', sound: 'ASH', hindi: 'आेश / आश', example: 'Homme', english: 'Man' },
        { letter: 'I', sound: 'EE', hindi: 'ई', example: 'Image', english: 'Picture' },
        { letter: 'J', sound: 'JHEE', hindi: 'जी', example: 'Jardin', english: 'Garden' },
        { letter: 'K', sound: 'KAH', hindi: 'का', example: 'Koala', english: 'Koala' },
        { letter: 'L', sound: 'L', hindi: 'एल', example: 'Livre', english: 'Book' },
        { letter: 'M', sound: 'M', hindi: 'एम', example: 'Maison', english: 'House' },
        { letter: 'N', sound: 'N', hindi: 'एन', example: 'Nuit', english: 'Night' },
        { letter: 'O', sound: 'O', hindi: 'ओ', example: 'Oiseau', english: 'Bird' },
        { letter: 'P', sound: 'PAY', hindi: 'पे', example: 'Pomme', english: 'Apple' },
        { letter: 'Q', sound: 'KEU', hindi: 'क्यु', example: 'Quatre', english: 'Four' },
        { letter: 'R', sound: 'ERR', hindi: 'एर', example: 'Rouge', english: 'Red' },
        { letter: 'S', sound: 'ESS', hindi: 'एस', example: 'Soleil', english: 'Sun' },
        { letter: 'T', sound: 'TAY', hindi: 'ते', example: 'Table', english: 'Table' },
        { letter: 'U', sound: 'EU', hindi: 'यु', example: 'Un', english: 'One' },
        { letter: 'V', sound: 'VAY', hindi: 'वे', example: 'Voiture', english: 'Car' },
        { letter: 'W', sound: 'Double WAY', hindi: 'दुबल वे', example: 'Wagon', english: 'Carriage' },
        { letter: 'X', sound: 'EXX', hindi: 'इक्स', example: 'Xylophone', english: 'Xylophone' },
        { letter: 'Y', sound: 'EGRICK', hindi: 'इग्रेक', example: 'Yeux', english: 'Eyes' },
        { letter: 'Z', sound: 'ZED', hindi: 'ज़ेद', example: 'Zèbre', english: 'Zebra' }
    ];

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('Speech synthesis is not supported in your browser.');
        }
    }

    const tbody = document.getElementById('alphabetTable');

    alphabetData.forEach(item => {
        const row = document.createElement('tr');
        const cleanExampleWord = item.example.split(' ')[0];
        
        row.innerHTML = `
            <td class="french-letter">${item.letter}</td>
            <td>
                ${item.sound}
                <button class="inline-audio-btn" onclick="playAudio('${item.letter}')" title="Listen to letter"></button>
            </td>
            <td class="hindi-sound">${item.hindi}</td>
            <td>
                ${item.example}
                <button class="inline-audio-btn" onclick="playAudio('${cleanExampleWord}')" title="Listen to example"></button>
            </td>
            <td>${item.english}</td>
        `;
        
        tbody.appendChild(row);
    });
</script>

</body>
</html>
